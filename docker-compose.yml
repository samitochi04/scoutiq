version: '3.8'

services:
  # ── Backend API ───────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scoutiq-api
    expose:
      - "8000"
    environment:
      # ── MongoDB ───────────────────────────────────────────────
      MONGODB_CLUSTER_USERNAME: ${MONGODB_CLUSTER_USERNAME}
      MONGODB_CLUSTER_PASSWORD: ${MONGODB_CLUSTER_PASSWORD}
      MONGODB_CLUSTER_CONNECTION: ${MONGODB_CLUSTER_CONNECTION}

      # ── Google Cloud ──────────────────────────────────────────
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GCP_REGION: ${GCP_REGION}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
      GCP_SERVICE_ACCOUNT_JSON: ${GCP_SERVICE_ACCOUNT_JSON}

      # ── Observability (optional) ──────────────────────────────
      ARIZE_API_KEY: ${ARIZE_API_KEY}
      ARIZE_SPACE_ID: ${ARIZE_SPACE_ID}

      # ── APIs ──────────────────────────────────────────────────
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY}

      # ── Server ────────────────────────────────────────────────
      PORT: 8000

    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "${VITE_API_URL}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Frontend (React + Vite) ───────────────────────────────────
  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: scoutiq-frontend
    expose:
      - "3000"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
